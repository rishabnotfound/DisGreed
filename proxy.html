<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisGreed Proxy</title>
</head>
<body>
    <script>
        (async () => {
            // Parse query parameters
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('data');

            if (!encodedData) {
                // No request data, just notify parent we're ready
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'PROXY_READY' }, '*');
                }
                return;
            }

            try {
                // Decode the request data
                const requestData = JSON.parse(decodeURIComponent(atob(encodedData)));
                const { url, method, headers, body, requestId } = requestData;
                console.log('Proxy: Making request', requestId, { url, method });

                // Make the fetch request
                const response = await fetch(url, {
                    method: method || 'GET',
                    headers: headers || {},
                    body: body ? JSON.stringify(body) : undefined
                });

                console.log('Proxy: Got response', requestId, { status: response.status, ok: response.ok });

                // Try to parse JSON, but handle 204 No Content and other empty responses
                let responseData = null;
                if (response.status !== 204 && response.headers.get('content-length') !== '0') {
                    responseData = await response.json().catch(() => null);
                }

                // Send response back to parent
                const messageData = {
                    type: 'WEBHOOK_RESPONSE',
                    requestId: requestId,
                    success: response.ok,
                    status: response.status,
                    data: responseData
                };
                console.log('Proxy: Sending postMessage to parent', messageData);
                if (window.parent !== window) {
                    window.parent.postMessage(messageData, '*');
                    console.log('Proxy: postMessage sent');
                }
            } catch (error) {
                console.error('Proxy: Error', error);
                // Send error back to parent
                if (window.parent !== window) {
                    try {
                        const requestData = JSON.parse(decodeURIComponent(atob(encodedData)));
                        window.parent.postMessage({
                            type: 'WEBHOOK_RESPONSE',
                            requestId: requestData.requestId,
                            success: false,
                            error: error.message
                        }, '*');
                    } catch (e) {
                        window.parent.postMessage({
                            type: 'WEBHOOK_RESPONSE',
                            requestId: 0,
                            success: false,
                            error: 'Failed to parse request data'
                        }, '*');
                    }
                }
            }
        })();
    </script>
</body>
</html>
