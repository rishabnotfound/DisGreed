<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DisGreed Proxy</title>
</head>
<body>
    <script>
        (async () => {
            // Parse query parameters
            const params = new URLSearchParams(window.location.search);
            const encodedData = params.get('data');

            if (!encodedData) {
                // No request data, just notify parent we're ready
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'PROXY_READY' }, '*');
                }
                return;
            }

            try {
                // Decode the request data
                const requestData = JSON.parse(decodeURIComponent(atob(encodedData)));
                const { url, method, headers, body, requestId } = requestData;

                // Make the fetch request
                const response = await fetch(url, {
                    method: method || 'GET',
                    headers: headers || {},
                    body: body ? JSON.stringify(body) : undefined
                });

                const responseData = await response.json().catch(() => null);

                // Send response back to parent
                if (window.parent !== window) {
                    window.parent.postMessage({
                        type: 'WEBHOOK_RESPONSE',
                        requestId: requestId,
                        success: response.ok,
                        status: response.status,
                        data: responseData
                    }, '*');
                }
            } catch (error) {
                // Send error back to parent
                if (window.parent !== window) {
                    const requestData = JSON.parse(decodeURIComponent(atob(encodedData)));
                    window.parent.postMessage({
                        type: 'WEBHOOK_RESPONSE',
                        requestId: requestData.requestId,
                        success: false,
                        error: error.message
                    }, '*');
                }
            }
        })();
    </script>
</body>
</html>
